[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-agent"
version = "0.1.0"
description = "Ledgerline — local LLM invoice email triage agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "google-auth>=2.0.0",
  "google-auth-oauthlib>=1.0.0",
  "google-api-python-client>=2.0.0",
  "itsdangerous>=2.0.0",
  "pypdf>=5.0.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
verify-agent = "scripts.verify_agent:main"
run-both-agents = "scripts.run_both_agents:main"
run-20-emails = "scripts.run_20_emails:main"
run-100-emails = "scripts.run_100_emails:main"
run-250-emails = "scripts.run_250_emails:main"
run-themes = "scripts.run_themes_corpus:main"
run-eval-50 = "scripts.run_eval_50:main"
run-eval-50b = "scripts.run_eval_50b:main"
run-adjudicator-100 = "scripts.run_adjudicator_100:main"
run-adjudicator-eval-100 = "scripts.run_adjudicator_eval_100:main"
dev = "invoice_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "static"
"templates" = "templates"

[tool.pytest.ini_options]
pythonpath = ["src"]
